name: CI Pipeline - SPU Agro-Retail Backend

on:
  push:
    branches:
      - main
      - master
      - Backend-SPU-Revision
  pull_request:
    branches:
      - main
      - master
      - Backend-SPU-Revision

jobs:
  test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spudev_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Type Checking
        run: npm run typecheck

      - name: Run Test Suite (Vitest)
        env:
          NODE_ENV: test
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432
          DB_NAME_TEST: spudev_test
          DB_USER_TEST: test_user
          DB_PASSWORD_TEST: test_password
          REDIS_URL: redis://localhost:6379
          SESS_SECRET: test_session_secret_32_characters_long_min
        run: npm test

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: spu-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
