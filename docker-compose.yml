version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spu_postgres
    environment:
      POSTGRES_USER: ${PGUSER_DEV:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD_DEV:-postgres}
      POSTGRES_DB: ${PGDATABASE_DEV:-spuofficial}
    ports:
      - "${PGPORT_DEV:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spuofficial"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-test:
    image: postgres:16-alpine
    container_name: spu_postgres_test
    environment:
      POSTGRES_USER: ${PGUSER_TEST:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD_TEST:-postgres}
      POSTGRES_DB: ${PGDATABASE_TEST:-spuofficial_test}
    ports:
      - "5433:5432"
    profiles:
      - test
    restart: unless-stopped

volumes:
  pgdata:

