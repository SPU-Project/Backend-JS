version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: spu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-spu_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spu_secret_password}
      POSTGRES_DB: ${DB_NAME:-spudev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - spu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spu_admin} -d ${DB_NAME:-spudev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spu-network

  redis:
    image: redis:7-alpine
    container_name: spu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - spu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - spu-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-spudev}
      DB_USER: ${DB_USER:-spu_admin}
      DB_PASSWORD: ${DB_PASSWORD:-spu_secret_password}
      REDIS_URL: redis://redis:6379
      SESS_SECRET: ${SESS_SECRET:-spu_super_secure_session_secret_key_32_chars}
    ports:
      - "5000:5000"
    volumes:
      - spu_uploads:/app/uploads
    networks:
      - spu-network

volumes:
  spu_postgres_data:
  spu_redis_data:
  spu_uploads:

networks:
  spu-network:
    driver: bridge
